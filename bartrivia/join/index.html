<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join tonight's game</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#12100D; color:#F4EFE6; padding:24px; box-sizing:border-box; }
  .card { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-0.3px; }
  p { color:#9A9184; font-size:15px; line-height:1.5; margin:6px 0; }
  .code { font-size:40px; font-weight:800; letter-spacing:8px; color:#E8A33D; margin:18px 0 4px; }
  a.btn { display:block; margin:10px 0; padding:14px 16px; border-radius:12px; text-decoration:none; font-weight:700; font-size:15px; }
  .primary { background:#E8A33D; color:#12100D; }
  .store { background:#1E1B16; color:#F4EFE6; border:1px solid #2E2A22; }
  .hint { font-size:12px; color:#9A9184; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>21st Century Game Night</h1>
    <p>Your table's been invited.</p>
    <div class="code" id="code">----</div>
    <p id="codeHint">Open the app and enter this code to join.</p>
    <a class="btn primary" id="openApp" href="#">Open in the app</a>
    <a class="btn store" id="ios" href="#" style="display:none">Get it on the App Store</a>
    <a class="btn store" id="android" href="#" style="display:none">Get it on Google Play</a>
    <p class="hint">Don't have it yet? Install it, then reopen this link or enter the code above.</p>
  </div>
  <script>
    // TODO(launch): the real store URLs. invite.ts carries the same pair — keep both in sync.
    var IOS_STORE = "";      // https://apps.apple.com/app/id<APPLE_ID>
    var ANDROID_STORE = "";  // https://play.google.com/store/apps/details?id=com.dfogel.bartrivia
    // The room-code alphabet has no vowels, so a code can never spell anything
    // and can never be misheard as a letter that isn't in the set. Anything
    // outside it is not a code, and saying so beats sending somebody into the
    // app to be told there is no such room.
    var raw = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
    var code = /^[CDFGHJKMNPRTVWXY3479]{4}$/.test(raw) ? raw : "";
    if (code) { document.getElementById("code").textContent = code; }
    else {
      document.getElementById("code").textContent = "—";
      document.getElementById("codeHint").textContent = "No room code in this link — ask the host for tonight's.";
    }
    document.getElementById("openApp").href = "bartrivia://join?code=" + code;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isAndroid = /android/i.test(navigator.userAgent);
    if (isIOS && IOS_STORE) { var i=document.getElementById("ios"); i.href=IOS_STORE; i.style.display="block"; }
    if (isAndroid && ANDROID_STORE) { var a=document.getElementById("android"); a.href=ANDROID_STORE; a.style.display="block"; }
  </script>
</body>
</html>
