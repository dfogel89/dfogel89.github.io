<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a FlipDeck game</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0e1116; color:#eef1f6; padding:24px; box-sizing:border-box; }
  .card { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:28px; margin:0 0 6px; }
  p { color:#8b93a3; font-size:15px; line-height:1.5; margin:6px 0; }
  .code { font-size:34px; font-weight:800; letter-spacing:6px; color:#2bd1bb; margin:16px 0 4px; }
  a.btn { display:block; margin:10px 0; padding:14px 16px; border-radius:12px; text-decoration:none; font-weight:700; font-size:15px; }
  .primary { background:#2bd1bb; color:#0b0e13; }
  .store { background:#1e242e; color:#eef1f6; border:1px solid #2c3340; }
  .hint { font-size:12px; color:#8b93a3; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>FlipDeck</h1>
    <p>You've been invited to a game.</p>
    <div class="code" id="code">----</div>
    <p id="codeHint">Open FlipDeck and enter this code to join.</p>
    <a class="btn primary" id="openApp" href="#">Open in the app</a>
    <a class="btn store" id="ios" href="#" style="display:none">Get it on the App Store</a>
    <a class="btn store" id="android" href="#" style="display:none">Get it on Google Play</a>
    <p class="hint">Don't have FlipDeck yet? Install it, then reopen this link or enter the code above.</p>
  </div>
  <script>
    // TODO(launch): fill in the real store URLs for FlipDeck.
    var IOS_STORE = "";      // https://apps.apple.com/app/id<APPLE_ID>
    var ANDROID_STORE = "";  // https://play.google.com/store/apps/details?id=com.dfogel.flipdeck
    var code = (new URLSearchParams(location.search).get("code") || "").replace(/[^0-9]/g, "").slice(0, 4);
    if (code) { document.getElementById("code").textContent = code; }
    else { document.getElementById("code").textContent = "—"; document.getElementById("codeHint").textContent = "No game code in this link."; }
    document.getElementById("openApp").href = "flipdeck://join?code=" + code;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isAndroid = /android/i.test(navigator.userAgent);
    if (isIOS && IOS_STORE) { var i=document.getElementById("ios"); i.href=IOS_STORE; i.style.display="block"; }
    if (isAndroid && ANDROID_STORE) { var a=document.getElementById("android"); a.href=ANDROID_STORE; a.style.display="block"; }
  </script>
</body>
</html>
