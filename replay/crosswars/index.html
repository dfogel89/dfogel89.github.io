<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossWars replay</title>
<meta name="description" content="Watch a game of CrossWars play out move by move.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#0e1116; color:#eef1f6; padding:18px 14px 40px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { width:100%; max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; font-family:Georgia,"Times New Roman",serif; }
  .sub { color:#8b93a3; font-size:13px; margin:0 0 16px; }
  .panel { background:#161b22; border:1px solid #2c3340; border-radius:12px; padding:13px; margin-bottom:11px; }
  .names { display:flex; justify-content:space-between; font-weight:800; font-size:13px; margin-bottom:6px; }
  .bar { height:16px; border-radius:8px; overflow:hidden; display:flex; }
  .bar > div { height:100%; }
  .under { display:flex; justify-content:space-between; color:#8b93a3; font-size:11px; margin-top:5px; }
  #graph { height:40px; display:flex; border-radius:6px; overflow:hidden; margin-top:12px; position:relative; }
  #graph .col { flex:1 1 0; display:flex; align-items:flex-end; opacity:.72; }
  #graph .col.on { opacity:1; outline:1.5px solid #eafff8; outline-offset:-1.5px; }
  #graph .col i { display:block; width:100%; }
  #board { display:grid; gap:1px; padding:3px; background:#07090c;
    border:1.5px solid #3a4250; border-radius:8px; margin:0 auto 11px; }
  .c { aspect-ratio:1; border-radius:2px; position:relative; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:min(3.2vw,17px); }
  .c.blank { background:transparent; }
  .c.open { background:#e9e3d4; border:1px solid #cdc4ae; }
  .c.hit { outline:2px solid #eafff8; outline-offset:-2px; z-index:2; }
  .c .n { position:absolute; top:0; left:1px; font-size:min(1.7vw,9px); font-weight:700; color:#9a927c; line-height:1; }
  .controls { display:flex; gap:8px; align-items:center; }
  button { font:inherit; border:0; border-radius:10px; padding:11px 12px; background:#232a34; color:#eef1f6;
    font-weight:800; font-size:13px; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  #play { flex:1; background:#2bd1bb; color:#07100e; }
  input[type=range] { width:100%; margin:14px 0 6px; accent-color:#2bd1bb; }
  .status { text-align:center; color:#8b93a3; font-size:12px; }
  .said { text-align:center; font-size:13px; margin-top:5px; }
  .lbl { font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px; color:#8b93a3; }
  #moves { max-height:280px; overflow:auto; margin-top:8px; }
  #moves .row { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px;
    border-left:3px solid transparent; cursor:pointer; }
  #moves .row.on { background:#232a34; }
  #moves .i { width:26px; color:#8b93a3; font-size:11px; }
  #moves .who { font-size:10.5px; font-weight:800; }
  #moves .main { font-size:14px; font-weight:700; letter-spacing:.4px; }
  #moves .det { margin-left:auto; color:#8b93a3; font-size:11px; text-align:right; }
  .note { color:#8b93a3; font-size:13px; line-height:1.5; }
  a { color:#2bd1bb; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CrossWars</h1>
  <p class="sub" id="sub">Loading the game…</p>
  <div id="app" hidden>
    <div class="panel">
      <div class="names"><span id="nA"></span><span id="nB"></span></div>
      <div class="bar"><div id="barA"></div><div id="barB"></div></div>
      <div class="under"><span id="sqA"></span><span id="fill"></span><span id="sqB"></span></div>
      <div id="graph"></div>
    </div>
    <div id="board"></div>
    <div class="panel">
      <div class="controls">
        <button id="first">&#9198;</button>
        <button id="prev">&#9664;</button>
        <button id="play">&#9654;&nbsp; Play</button>
        <button id="next">&#9654;</button>
        <button id="last">&#9197;</button>
      </div>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <div class="status" id="status"></div>
      <div class="said" id="said"></div>
    </div>
    <div class="panel">
      <div class="lbl">every move</div>
      <div id="moves"></div>
    </div>
  </div>
  <div id="err" class="panel note" hidden></div>
</div>

<script>
/* CrossWars replay viewer.

   The room is already on the server under crosswars/rooms/<code> and the
   database is world-readable, so this page needs no key and no backend: fetch
   the room, apply its move log to the opening board, and step through.

   The reconstruction here MUST match replayFrames() in the app's engine.ts.
   Both apply the same delta log to `white0`; the app's version is covered by a
   test that replays 80 simulated games and asserts the final frame equals the
   real final board. Keep the two in step if the log format ever changes.

   NOTE: this page lives at /replay/crosswars/, deliberately outside the
   /crosswars/* prefix the app claims as a Universal Link / App Link — a replay
   under that prefix would be swallowed by the installed app. */

var DB = "https://salad-bowl-3ba36-default-rtdb.firebaseio.com";
var N = 20;
var EXPOSED_P = 0.75;

var code = (new URLSearchParams(location.search).get("code") || "").replace(/[^0-9]/g, "").slice(0, 4);
var room = null, frames = [], evals = [], idx = 0, timer = null;
// clue numbering is per board SHAPE, so it only changes on a reshape — cache it.
// Declared up here with the rest of the state: it's read by render(), which can
// be reached from build() before a `var` further down the file has run.
var numCache = {};

function fail(msg) {
  document.getElementById("sub").textContent = "";
  var e = document.getElementById("err");
  e.hidden = false;
  e.innerHTML = msg;
}

if (!code) {
  fail("This link doesn't have a game code in it. Ask for the replay link again.");
} else {
  fetch(DB + "/crosswars/rooms/" + code + ".json")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (data) {
      if (!data) { fail("There's no game with code <b>" + code + "</b> any more."); return; }
      room = data;
      if (!room.white0 || room.white0.length !== N * N || room.logCut) {
        fail("This game was played before replays were recorded, so there's nothing to step through.");
        return;
      }
      build();
    })
    .catch(function () { fail("Couldn't load that game. Check your connection and try again."); });
}

function opp(s) { return s === "A" ? "B" : "A"; }

/* ---- rebuild every position from white0 + the log ---- */
function build() {
  var log = Array.isArray(room.log) ? room.log : [];
  var white = room.white0.split("");
  var blank = new Array(N * N + 1).join(".");
  var letters = blank.split(""), owner = blank.split("");
  var turn = room.starter === "B" ? "B" : "A";

  function snap(entry, cells) {
    var a = 0, b = 0;
    for (var i = 0; i < owner.length; i++) { if (owner[i] === "A") a++; else if (owner[i] === "B") b++; }
    frames.push({
      white: white.join(""), letters: letters.join(""), owner: owner.join(""),
      turn: turn, entry: entry, cells: cells, a: a, b: b,
    });
  }
  snap(null, []);
  for (var k = 0; k < log.length; k++) {
    var e = log[k], cells = [];
    if (e.k === "word" && e.cells && e.put) {
      for (var i = 0; i < e.cells.length; i++) {
        var ci = e.cells[i];
        if (ci < 0 || ci >= N * N) continue;
        letters[ci] = e.put[i]; owner[ci] = e.by;
      }
      cells = e.cells.slice(); turn = opp(e.by);
    } else if (e.k === "pass" || e.k === "timeout") {
      turn = opp(e.by);
    } else if (e.k === "delete" && e.from != null) {
      white[e.from] = "0"; letters[e.from] = "."; owner[e.from] = ".";
      cells = [e.from];
    } else if (e.k === "move" && e.from != null && e.to != null) {
      white[e.from] = "0"; letters[e.from] = "."; owner[e.from] = ".";
      white[e.to] = "1";
      cells = [e.from, e.to];
    }
    snap(e, cells);
  }
  evals = frames.map(function (f) { return evalBoard(f.white, f.letters, f.owner); });
  start();
}

/* ---- the same eval the app's review screen shows (bot.ts evalBoard) ---- */
function runOpen(white, letters, r, c, dir) {
  var i;
  if (dir === "A") {
    var cc = c; while (cc - 1 >= 0 && white[r * N + cc - 1] === "1") cc--;
    for (; cc < N && white[r * N + cc] === "1"; cc++) if (letters[r * N + cc] === ".") return true;
  } else {
    var rr = r; while (rr - 1 >= 0 && white[(rr - 1) * N + c] === "1") rr--;
    for (; rr < N && white[rr * N + c] === "1"; rr++) if (letters[rr * N + c] === ".") return true;
  }
  return false;
}
function evalBoard(white, letters, owner) {
  var sum = 0, total = 0, a = 0, b = 0, filled = 0;
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
    var i = r * N + c;
    if (white[i] !== "1") continue;
    total++;
    var o = owner[i];
    if (o !== "A" && o !== "B") { sum += 0.5; continue; }
    filled++;
    if (o === "A") a++; else b++;
    var open = runOpen(white, letters, r, c, "A") || runOpen(white, letters, r, c, "D");
    sum += o === "A" ? (open ? EXPOSED_P : 1) : (open ? 1 - EXPOSED_P : 0);
  }
  return { share: total ? sum / total : 0.5, a: a, b: b, filled: filled, total: total };
}

/* ---- clue numbers for whichever board shape this frame has ---- */
function numbers(white) {
  var starts = {}, num = {}, n = 1;
  function isW(r, c) { return r >= 0 && r < N && c >= 0 && c < N && white[r * N + c] === "1"; }
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
    if (!isW(r, c)) continue;
    var aStart = !isW(r, c - 1) && isW(r, c + 1) && isW(r, c + 2);
    var dStart = !isW(r - 1, c) && isW(r + 1, c) && isW(r + 2, c);
    if (aStart || dStart) starts[r * N + c] = true;
  }
  for (var i = 0; i < N * N; i++) if (starts[i]) num[i] = n++;
  return num;
}

function tint(hex) {
  function p(i) { return parseInt(hex.slice(i, i + 2), 16); }
  var to = [0x0e, 0x11, 0x16], src = [p(1), p(3), p(5)], out = [];
  for (var i = 0; i < 3; i++) out.push(Math.round(src[i] + (to[i] - src[i]) * 0.82));
  return "rgb(" + out.join(",") + ")";
}

function moveText(e) {
  function rc(i) { return "row " + (Math.floor(i / N) + 1) + ", col " + ((i % N) + 1); }
  if (e.k === "word") {
    var g = e.cells ? e.cells.length : 0;
    var bits = [(e.num || "?") + "-" + (e.dir === "D" ? "Down" : "Across"), "+" + g + (g === 1 ? " square" : " squares")];
    if (e.steals) bits.push("stole " + e.steals);
    return { main: e.word || e.put || "", detail: bits.join(" · ") };
  }
  if (e.k === "pass") return { main: "Passed", detail: "" };
  if (e.k === "timeout") return { main: "Ran out of time", detail: "turn forfeited" };
  if (e.k === "resign") return { main: "Resigned", detail: "" };
  if (e.k === "delete") return { main: "Deleted a square", detail: e.from != null ? rc(e.from) : "" };
  if (e.k === "move") return { main: "Moved a square", detail: e.from != null ? rc(e.from) + " → " + rc(e.to) : "" };
  return { main: "—", detail: "" };
}

function said(e) {
  if (e.k === "word") {
    var g = e.cells ? e.cells.length : 0;
    return "played " + e.word + " for " + g + (g === 1 ? " square" : " squares") + (e.steals ? ", stealing " + e.steals : "") + ".";
  }
  if (e.k === "pass") return "passed.";
  if (e.k === "timeout") return "ran out of time.";
  if (e.k === "resign") return "resigned.";
  if (e.k === "delete") return "deleted a square.";
  return "moved a square.";
}

var nameA, nameB, colA, colB;
function nameOf(s) { return s === "A" ? nameA : nameB; }
function colOf(s) { return s === "A" ? colA : colB; }

function start() {
  nameA = (room.seatA && room.seatA.name) || "Player 1";
  nameB = (room.seatB && room.seatB.name) || "Player 2";
  colA = room.colorA || "#2bd1bb";
  colB = room.colorB || "#f2556f";

  var res = room.result === "draw" ? "a tie"
    : room.result ? nameOf(room.result) + " won"
    : "still in progress";
  document.getElementById("sub").textContent = nameA + " vs " + nameB + " — " + res;
  document.getElementById("nA").textContent = nameA;
  document.getElementById("nA").style.color = colA;
  document.getElementById("nB").textContent = nameB;
  document.getElementById("nB").style.color = colB;
  document.getElementById("barA").style.background = colA;
  document.getElementById("barB").style.background = colB;

  var board = document.getElementById("board");
  board.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";
  board.style.width = "min(100%, 560px)";
  for (var i = 0; i < N * N; i++) {
    var d = document.createElement("div");
    d.className = "c blank";
    board.appendChild(d);
  }

  var g = document.getElementById("graph");
  g.style.background = colB;
  for (var f = 0; f < frames.length; f++) {
    var col = document.createElement("div");
    col.className = "col";
    var fill = document.createElement("i");
    fill.style.background = colA;
    fill.style.height = Math.max(1, evals[f].share * 40) + "px";
    col.appendChild(fill);
    g.appendChild(col);
  }

  var moves = document.getElementById("moves");
  var log = Array.isArray(room.log) ? room.log : [];
  for (var m = 0; m < log.length; m++) {
    var t = moveText(log[m]);
    var row = document.createElement("div");
    row.className = "row";
    row.dataset.i = m;
    row.innerHTML =
      '<span class="i">' + (m + 1) + '</span>' +
      '<span><span class="who" style="color:' + colOf(log[m].by) + '">' + esc(nameOf(log[m].by)) + '</span><br>' +
      '<span class="main">' + esc(t.main) + '</span></span>' +
      '<span class="det">' + esc(t.detail) + '</span>';
    row.onclick = (function (n) { return function () { stop(); go(n + 1); }; })(m);
    moves.appendChild(row);
  }

  var scrub = document.getElementById("scrub");
  scrub.max = String(frames.length - 1);
  scrub.oninput = function () { stop(); go(+scrub.value); };
  document.getElementById("first").onclick = function () { stop(); go(0); };
  document.getElementById("prev").onclick = function () { stop(); go(idx - 1); };
  document.getElementById("next").onclick = function () { stop(); go(idx + 1); };
  document.getElementById("last").onclick = function () { stop(); go(frames.length - 1); };
  document.getElementById("play").onclick = function () {
    if (timer) { stop(); return; }
    if (idx >= frames.length - 1) go(0);
    timer = setInterval(function () {
      if (idx >= frames.length - 1) { stop(); return; }
      go(idx + 1);
    }, 750);
    render();
  };

  document.getElementById("app").hidden = false;
  go(0);
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function stop() { if (timer) { clearInterval(timer); timer = null; render(); } }
function go(n) { idx = Math.max(0, Math.min(frames.length - 1, n)); render(); }

function render() {
  var f = frames[idx], ev = evals[idx];
  var num = numCache[f.white] || (numCache[f.white] = numbers(f.white));
  var hit = {};
  for (var i = 0; i < f.cells.length; i++) hit[f.cells[i]] = true;

  var cells = document.getElementById("board").children;
  for (var j = 0; j < N * N; j++) {
    var el = cells[j];
    var isW = f.white[j] === "1";
    var L = f.letters[j] === "." ? "" : f.letters[j];
    var o = f.owner[j] === "A" || f.owner[j] === "B" ? f.owner[j] : null;
    el.className = "c " + (isW ? "open" : "blank") + (hit[j] ? " hit" : "");
    if (!isW) { el.textContent = ""; el.removeAttribute("style"); continue; }
    el.style.background = o ? tint(colOf(o)) : "#e9e3d4";
    el.style.border = "1px solid " + (o ? colOf(o) : "#cdc4ae");
    el.style.color = o ? colOf(o) : "#1a1a1a";
    el.innerHTML = (num[j] ? '<span class="n">' + num[j] + "</span>" : "") + esc(L);
  }

  document.getElementById("barA").style.width = (ev.share * 100) + "%";
  document.getElementById("barB").style.width = ((1 - ev.share) * 100) + "%";
  document.getElementById("sqA").textContent = ev.a + " squares";
  document.getElementById("sqB").textContent = ev.b + " squares";
  document.getElementById("fill").textContent = ev.filled + " of " + ev.total + " filled";

  var cols = document.getElementById("graph").children;
  for (var g = 0; g < cols.length; g++) cols[g].className = "col" + (g === idx ? " on" : "");

  document.getElementById("scrub").value = String(idx);
  document.getElementById("status").textContent =
    idx === 0 ? "The opening board" : "Move " + idx + " of " + (frames.length - 1);
  var sd = document.getElementById("said");
  if (f.entry) {
    sd.innerHTML = '<b style="color:' + colOf(f.entry.by) + '">' + esc(nameOf(f.entry.by)) + "</b> " + esc(said(f.entry));
  } else { sd.textContent = ""; }

  document.getElementById("play").innerHTML = timer ? "&#10074;&#10074;&nbsp; Pause"
    : idx >= frames.length - 1 ? "&#9654;&nbsp; Replay" : "&#9654;&nbsp; Play";
  document.getElementById("first").disabled = idx === 0;
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx >= frames.length - 1;
  document.getElementById("last").disabled = idx >= frames.length - 1;

  var rows = document.getElementById("moves").children;
  for (var m = 0; m < rows.length; m++) {
    var on = m === idx - 1;
    rows[m].className = "row" + (on ? " on" : "");
    rows[m].style.borderLeftColor = on ? colOf(room.log[m].by) : "transparent";
    if (on) rows[m].scrollIntoView({ block: "nearest" });
  }
}
</script>
</body>
</html>
